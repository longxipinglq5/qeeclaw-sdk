# QeeClaw Hermes Bridge
#
# Python 桥接服务：充当 TypeScript SDK 与 hermes-agent 之间的 HTTP 适配器。
# SDK 默认 Runtime 为 Hermes，通过此桥接服务调用 hermes-agent 核心。

[project]
name = "qeeclaw-hermes-bridge"
version = "0.1.0"
description = "HTTP bridge between QeeClaw TypeScript SDK and hermes-agent Python runtime"
requires-python = ">=3.9"
license = { text = "Apache-2.0" }
dependencies = [
    "openai>=2.21.0,<3",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.34.0",
    "pyyaml>=6.0",
    "watchfiles>=0.24.0",
    "chromadb==1.0.7",
    "numpy>=1.26.0",
    "pypdf>=5.0.0",
    "aiohttp>=3.9.0",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
sentence-transformers = [
    "sentence-transformers>=3.0.0",
]

hermes = [
    # 当用户需要完整的 hermes-agent 能力时安装
    "hermes-agent",
]
dev = [
    "pytest>=9.0,<10",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.28,<1",
    "pydantic-settings>=2.0,<3",
    "python-dotenv>=1.0,<2",
    "sse-starlette>=2.0,<3",
]

[project.scripts]
qeeclaw-hermes-bridge = "bridge_server:main"
qeeclaw-bridge = "bridge.main:cli"

[tool.setuptools]
py-modules = ["bridge_server", "bailian_image", "wechat_gateway", "knowledge_store", "memory_store", "session_manager", "cloud_tunnel"]

[tool.setuptools.packages.find]
include = ["bridge*"]

[tool.setuptools.package-data]
"bridge.hermes_plugins.image_gen.qeeclaw_nexus" = ["plugin.yaml"]

[tool.pytest.ini_options]
testpaths = ["bridge/tests"]
asyncio_mode = "auto"
